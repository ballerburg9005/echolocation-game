name: CUDA compilation smoke test

on:
  pull_request:
    paths:
      - '**/*.cu'
      - '**/*.h'
      - 'Makefile'
      - '.github/workflows/cuda-build.yml'
  workflow_dispatch:

concurrency:
  group: cuda-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cuda-compile:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install application headers and host toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            g++ make libgl1-mesa-dev libglew-dev libsdl2-dev libtinyxml2-dev libglm-dev libmpg123-dev
      - name: Compile CUDA/SDL2/OpenGL executable (no GPU needed for compile)
        run: make build asmr
