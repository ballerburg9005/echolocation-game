name: CPU physics, collision and SVG tests

on:
  push:
    branches:
      - main
      - 'improve/**'
  pull_request:

concurrency:
  group: cpu-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install curved SVG raster dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-dev libcairo2-dev pkg-config
      - name: Compile and run physics and curved SVG numerical tests
        shell: bash
        run: |
          set -euo pipefail
          for source in tests/test_*.cpp; do
            executable="/tmp/$(basename "$source" .cpp)"
            if [[ "$(basename "$source")" == "test_asmr_svg.cpp" ]]; then
              g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
                $(pkg-config --cflags librsvg-2.0 cairo) \
                "$source" -o "$executable" \
                $(pkg-config --libs librsvg-2.0 cairo)
            else
              g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
                "$source" -o "$executable"
            fi
            "$executable"
          done
